<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luca — Webdesign für KMU</title>
  <meta name="description" content="Webdesign und Umsetzung für Handwerk, Gewerbe und KMU in Graubünden und St. Gallen.">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;900&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div style="width:100%;">

  <!-- ===== HERO ===== -->
  <section class="hero">
    <div class="hero-glow"></div>
    <div class="hero-logo" role="img" aria-label="LP"></div>
    <div class="hero-region hero-region--left">Graubünden</div>
    <div class="hero-region hero-region--right">St. Gallen</div>
    <nav class="hide-mobile hero-nav">
      <a class="nav-link nav-link--active" href="#">Start</a>
      <a class="nav-link" href="#ueber-mich">Über mich</a>
      <a class="nav-link" href="#referenzen">Referenzen</a>
    </nav>
  </section>

  <!-- ===== BILDER-STREIFEN (Platzhalter — Fotos folgen) ===== -->
  <div class="photo-strip">
    <div class="photo-strip-item">
      <img src="assets/strip-1.jpg" alt="" onerror="this.parentElement.classList.add('photo-strip-item--missing')">
    </div>
    <div class="photo-strip-item">
      <img src="assets/strip-2.jpg" alt="" onerror="this.parentElement.classList.add('photo-strip-item--missing')">
    </div>
    <div class="photo-strip-item">
      <img src="assets/strip-3.jpg" alt="" onerror="this.parentElement.classList.add('photo-strip-item--missing')">
    </div>
  </div>

  <!-- ===== WEISSER BEREICH (Platzhalter, 3 Teile) ===== -->
  <section style="width:100%; background:var(--paper); min-height:1000px; display:grid; grid-template-rows:repeat(3, 1fr);">
    <div style="display:flex; align-items:center; justify-content:center; text-align:center; padding:40px;">
      <p class="shimmer-text reveal" style="font-family:'Source Serif 4', Georgia, serif; font-weight:400; font-size:clamp(24px,3.4vw,36px); line-height:1.35; max-width:800px; margin:0 auto;">
        Der erste Eindruck deiner Marke<br>
        beginnt online.
      </p>
    </div>
    <div></div>
    <div></div>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
