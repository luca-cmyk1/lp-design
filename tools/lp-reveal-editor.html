<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LP Reveal Editor</title>
  <style>
    :root {
      --bg: #0B1310;
      --panel: #141D18;
      --line: #2A3830;
      --ink: #F2ECDC;
      --muted: #8C8671;
      --gold: #B38B45;
      --gold-light: #D8B876;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      background: var(--bg);
      color: var(--ink);
      display: grid;
      grid-template-columns: 300px 1fr;
      min-height: 100vh;
    }
    aside {
      border-right: 1px solid var(--line);
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: var(--panel);
      overflow-y: auto;
    }
    h1 {
      margin: 0;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold-light);
      font-weight: 500;
    }
    p.hint {
      margin: 0;
      font-size: 11px;
      line-height: 1.55;
      color: var(--muted);
    }
    .group { display: flex; flex-direction: column; gap: 6px; }
    .group label {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .group label span.val { color: var(--gold-light); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    button, select {
      font: inherit;
      font-size: 12px;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
      padding: 8px 10px;
      cursor: pointer;
    }
    button:hover { border-color: var(--gold); color: var(--gold-light); }
    button.primary {
      background: var(--gold);
      border-color: var(--gold);
      color: #141414;
    }
    button.primary:hover { background: var(--gold-light); border-color: var(--gold-light); }
    button.active {
      border-color: var(--gold);
      color: var(--gold-light);
      background: rgba(179,139,69,0.12);
    }
    input[type="range"] { width: 100%; accent-color: var(--gold); }
    .status {
      font-size: 11px;
      color: var(--muted);
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      line-height: 1.45;
    }
    main {
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(80% 60% at 50% 40%, rgba(60,83,67,0.16), transparent 70%),
        var(--bg);
    }
    .stage-wrap {
      width: min(92vw - 300px, 980px);
      aspect-ratio: 1800 / 1083;
      position: relative;
      border: 1px solid var(--line);
      background: #000;
      touch-action: none;
    }
    .stage-wrap canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    .overlay-hint {
      position: absolute;
      left: 12px;
      bottom: 10px;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(242,236,220,0.4);
      pointer-events: none;
    }
    textarea {
      width: 100%;
      min-height: 88px;
      font: inherit;
      font-size: 10px;
      color: var(--ink);
      background: #0B1310;
      border: 1px solid var(--line);
      padding: 8px;
      resize: vertical;
    }
  </style>
</head>
<body>
  <aside>
    <h1>LP Reveal Editor</h1>
    <p class="hint">
      Logo startet unsichtbar. Wähle L oder P, dann ziehe eine Kante
      direkt in die Buchstaben-Füllung. Die Füllung erscheint nur bis zu dieser Kante.
    </p>

    <div class="group">
      <label>Buchstabe</label>
      <div class="row">
        <button type="button" id="btn-L" class="active">L</button>
        <button type="button" id="btn-P">P</button>
      </div>
    </div>

    <div class="group">
      <label>Reveal L <span class="val" id="v-progL">0%</span></label>
      <input type="range" id="progL" min="0" max="1000" value="0">
      <label>Reveal P <span class="val" id="v-progP">0%</span></label>
      <input type="range" id="progP" min="0" max="1000" value="0">
    </div>

    <div class="group">
      <label>Kanten-Weichheit <span class="val" id="v-soft">18</span></label>
      <input type="range" id="soft" min="0" max="80" value="18">
      <label>Ghost-Outline</label>
      <div class="row">
        <button type="button" id="btn-ghost" class="active">An</button>
      </div>
    </div>

    <div class="group">
      <label>Kante</label>
      <div class="row">
        <button type="button" id="btn-clear">Aktuelle löschen</button>
        <button type="button" id="btn-clear-all">Beide löschen</button>
      </div>
      <div class="row">
        <button type="button" id="btn-flip">Seite tauschen</button>
      </div>
    </div>

    <div class="group">
      <label>Vorschau</label>
      <div class="row">
        <button type="button" id="btn-play">Play beide</button>
        <button type="button" id="btn-reset">Reset</button>
      </div>
    </div>

    <div class="group">
      <label>Export JSON</label>
      <textarea id="export" readonly></textarea>
      <div class="row">
        <button type="button" id="btn-copy" class="primary">Kopieren</button>
        <button type="button" id="btn-download">Download</button>
      </div>
    </div>

    <p class="status" id="status">Buchstabe L · Ziehe eine Kante in die Füllung</p>
  </aside>

  <main>
    <div class="stage-wrap" id="stage">
      <canvas id="cv" width="1800" height="1083"></canvas>
      <div class="overlay-hint">Ziehen = Reveal-Kante im Buchstaben</div>
    </div>
  </main>

  <script>
(function () {
  var LP_L = 'M782.83,554.30C738.18,652.43 693.41,751.69 654.06,838.11L44.50,838.11C122.72,666.08 272.90,335.53 407.34,40.00L721.35,40.00C642.32,213.78 560.44,395.93 488.49,554.30L782.83,554.30Z';
  var LP_P = 'M1433.46,127.00L1016.02,127.00C1015.38,127.00 1014.89,127.48 1014.41,127.80C954.02,260.79 886.24,409.85 820.86,553.92C776.21,652.05 732.69,747.79 693.50,834.04C657.36,913.38 624.91,984.86 598.57,1043.00L909.89,1043.00L1136.00,549.61L1136.00,549.58L1198.16,412.73C1198.32,412.41 1198.64,412.25 1198.96,411.93C1199.44,411.45 1200.08,411.13 1200.89,411.13L1400.86,411.13C1443.26,411.13 1471.05,455.30 1452.74,493.53C1434.90,530.31 1397.65,553.92 1356.69,553.92L1170.23,553.92L1041.56,838.37L1327.45,838.37C1499.15,838.37 1655.11,737.99 1726.27,581.54C1746.35,537.70 1755.50,492.41 1755.50,448.40C1755.50,279.27 1619.14,127.00 1433.46,127.00Z';

  var W = 1800, H = 1083;
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var pathL = new Path2D(LP_L);
  var pathP = new Path2D(LP_P);

  // Per letter: edge as two points (line through letter) + which side is filled
  var edges = {
    L: { a: null, b: null, flip: false },
    P: { a: null, b: null, flip: false }
  };
  var active = 'L';
  var prog = { L: 0, P: 0 };
  var soft = 18;
  var ghost = true;
  var drawing = null; // { letter, start }
  var playing = false;

  var $ = function (id) { return document.getElementById(id); };

  function letterPath(letter) { return letter === 'L' ? pathL : pathP; }

  function canvasPos(e) {
    var r = cv.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) / r.width * W,
      y: (e.clientY - r.top) / r.height * H
    };
  }

  function hitLetter(letter, x, y) {
    return ctx.isPointInPath(letterPath(letter), x, y);
  }

  // Soft half-plane mask for one letter, edge a→b, progress grows fill from start side
  function paintLetterReveal(letter) {
    var edge = edges[letter];
    var p = prog[letter];
    if (!edge.a || !edge.b || p <= 0.001) return;

    var ax = edge.a.x, ay = edge.a.y, bx = edge.b.x, by = edge.b.y;
    var ex = bx - ax, ey = by - ay;
    var elen = Math.hypot(ex, ey) || 1;
    // Edge direction and normal
    var tx = ex / elen, ty = ey / elen;
    var nx = -ty, ny = tx;
    if (edge.flip) { nx = -nx; ny = -ny; }

    // Progress: edge sweeps along its normal across the letter bbox
    var bbox = letter === 'L'
      ? { x0: 44, y0: 40, x1: 783, y1: 838 }
      : { x0: 598, y0: 127, x1: 1756, y1: 1043 };
    var corners = [
      [bbox.x0, bbox.y0], [bbox.x1, bbox.y0],
      [bbox.x1, bbox.y1], [bbox.x0, bbox.y1]
    ];
    // Midpoint of drawn edge is the "current" front at progress mapped onto normal range
    var mx = (ax + bx) / 2, my = (ay + by) / 2;
    var edgeDist = mx * nx + my * ny;
    var mins = Infinity, maxs = -Infinity;
    for (var i = 0; i < 4; i++) {
      var s = corners[i][0] * nx + corners[i][1] * ny;
      if (s < mins) mins = s;
      if (s > maxs) maxs = s;
    }
    var pad = soft * 2 + 20;
    mins -= pad; maxs += pad;
    // p=0 leer · p=0.5 genau an gezeichneter Kante · p=1 voll
    var dist;
    if (p <= 0.5) dist = mins + (edgeDist - mins) * (p / 0.5);
    else dist = edgeDist + (maxs - edgeDist) * ((p - 0.5) / 0.5);

    // Build gradient mask
    var mask = document.createElement('canvas');
    mask.width = W; mask.height = H;
    var m = mask.getContext('2d');

    // Clip to letter first on mask, then fill gradient
    m.save();
    m.fillStyle = '#000';
    m.fillRect(0, 0, W, H);
    m.clip(letterPath(letter));

    var span = 5000;
    var cx = (bbox.x0 + bbox.x1) / 2;
    var cy = (bbox.y0 + bbox.y1) / 2;
    var g = m.createLinearGradient(
      cx - nx * span / 2, cy - ny * span / 2,
      cx + nx * span / 2, cy + ny * span / 2
    );
    var c0 = cx * nx + cy * ny;
    var u = 0.5 + (dist - c0) / span;
    var uSoft = Math.max(0.0001, soft) / span;
    var u0 = Math.max(0, Math.min(1, u - uSoft));
    var u1 = Math.max(0, Math.min(1, u + uSoft));
    if (u1 <= u0) u1 = Math.min(1, u0 + 0.001);
    g.addColorStop(u0, 'rgba(255,255,255,0)');
    g.addColorStop(u1, 'rgba(255,255,255,1)');
    m.fillStyle = g;
    m.fillRect(0, 0, W, H);
    m.restore();

    ctx.drawImage(mask, 0, 0);
  }

  function paintEdgeOverlay(letter) {
    var edge = edges[letter];
    if (!edge.a || !edge.b) return;
    var isActive = letter === active;
    ctx.save();
    ctx.strokeStyle = isActive ? 'rgba(216,184,118,0.95)' : 'rgba(179,139,69,0.35)';
    ctx.lineWidth = isActive ? 4 : 2;
    ctx.setLineDash(isActive ? [] : [8, 8]);
    ctx.beginPath();
    ctx.moveTo(edge.a.x, edge.a.y);
    ctx.lineTo(edge.b.x, edge.b.y);
    ctx.stroke();

    // extend dashed guide across letter
    var ex = edge.b.x - edge.a.x, ey = edge.b.y - edge.a.y;
    var len = Math.hypot(ex, ey) || 1;
    var tx = ex / len, ty = ey / len;
    ctx.strokeStyle = isActive ? 'rgba(216,184,118,0.35)' : 'rgba(179,139,69,0.15)';
    ctx.setLineDash([10, 10]);
    ctx.beginPath();
    ctx.moveTo(edge.a.x - tx * 2000, edge.a.y - ty * 2000);
    ctx.lineTo(edge.a.x + tx * 2000, edge.a.y + ty * 2000);
    ctx.stroke();

    // handles
    if (isActive) {
      ctx.fillStyle = '#B38B45';
      [[edge.a.x, edge.a.y], [edge.b.x, edge.b.y]].forEach(function (pt) {
        ctx.beginPath();
        ctx.arc(pt[0], pt[1], 9, 0, Math.PI * 2);
        ctx.fill();
      });
      // normal arrow (fill direction)
      var mx = (edge.a.x + edge.b.x) / 2;
      var my = (edge.a.y + edge.b.y) / 2;
      var nx = -ty, ny = tx;
      if (edge.flip) { nx = -nx; ny = -ny; }
      ctx.strokeStyle = '#D8B876';
      ctx.fillStyle = '#D8B876';
      ctx.setLineDash([]);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(mx, my);
      ctx.lineTo(mx + nx * 55, my + ny * 55);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(mx + nx * 55, my + ny * 55);
      ctx.lineTo(mx + nx * 40 - ty * 8, my + ny * 40 + tx * 8);
      ctx.lineTo(mx + nx * 40 + ty * 8, my + ny * 40 - tx * 8);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function paint() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // Ghost outlines (not filled) so user sees where to draw — logo fill stays hidden until reveal
    if (ghost) {
      ctx.save();
      ctx.strokeStyle = 'rgba(242,236,220,0.14)';
      ctx.lineWidth = 2;
      ctx.stroke(pathL);
      ctx.stroke(pathP);
      // dim active letter a bit more visible
      ctx.strokeStyle = active === 'L' ? 'rgba(216,184,118,0.35)' : 'rgba(216,184,118,0.35)';
      ctx.stroke(active === 'L' ? pathL : pathP);
      ctx.restore();
    }

    // Revealed fills
    ctx.save();
    paintLetterReveal('L');
    paintLetterReveal('P');
    ctx.restore();

    // Edge overlays on top
    paintEdgeOverlay('L');
    paintEdgeOverlay('P');

    // live draw preview
    if (drawing && drawing.start) {
      var p = drawing.curr || drawing.start;
      ctx.save();
      ctx.strokeStyle = 'rgba(216,184,118,0.9)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(drawing.start.x, drawing.start.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      ctx.restore();
    }

    updateExport();
  }

  function updateLabels() {
    $('v-progL').textContent = Math.round(prog.L * 100) + '%';
    $('v-progP').textContent = Math.round(prog.P * 100) + '%';
    $('v-soft').textContent = String(soft);
    var e = edges[active];
    var has = e.a && e.b;
    $('status').textContent = has
      ? ('Buchstabe ' + active + ' · Kante gesetzt · Progress steuert die Füllung bis zur Kante-Richtung')
      : ('Buchstabe ' + active + ' · Ziehe eine Kante durch die Füllung');
  }

  function updateExport() {
    function ser(ed) {
      if (!ed.a || !ed.b) return null;
      return {
        a: { x: round1(ed.a.x), y: round1(ed.a.y) },
        b: { x: round1(ed.b.x), y: round1(ed.b.y) },
        flip: !!ed.flip
      };
    }
    var cfg = {
      soft: soft,
      progress: { L: round3(prog.L), P: round3(prog.P) },
      edges: { L: ser(edges.L), P: ser(edges.P) }
    };
    $('export').value = JSON.stringify(cfg, null, 2);
  }

  function round1(n) { return Math.round(n * 10) / 10; }
  function round3(n) { return Math.round(n * 1000) / 1000; }

  function setActive(letter) {
    active = letter;
    $('btn-L').classList.toggle('active', letter === 'L');
    $('btn-P').classList.toggle('active', letter === 'P');
    updateLabels();
    paint();
  }

  $('btn-L').addEventListener('click', function () { setActive('L'); });
  $('btn-P').addEventListener('click', function () { setActive('P'); });
  $('btn-ghost').addEventListener('click', function () {
    ghost = !ghost;
    $('btn-ghost').classList.toggle('active', ghost);
    $('btn-ghost').textContent = ghost ? 'An' : 'Aus';
    paint();
  });
  $('progL').addEventListener('input', function () {
    prog.L = Number($('progL').value) / 1000;
    updateLabels(); paint();
  });
  $('progP').addEventListener('input', function () {
    prog.P = Number($('progP').value) / 1000;
    updateLabels(); paint();
  });
  $('soft').addEventListener('input', function () {
    soft = Number($('soft').value);
    updateLabels(); paint();
  });
  $('btn-clear').addEventListener('click', function () {
    edges[active] = { a: null, b: null, flip: false };
    updateLabels(); paint();
  });
  $('btn-clear-all').addEventListener('click', function () {
    edges.L = { a: null, b: null, flip: false };
    edges.P = { a: null, b: null, flip: false };
    updateLabels(); paint();
  });
  $('btn-flip').addEventListener('click', function () {
    edges[active].flip = !edges[active].flip;
    paint();
  });
  $('btn-reset').addEventListener('click', function () {
    playing = false;
    prog.L = 0; prog.P = 0;
    $('progL').value = 0; $('progP').value = 0;
    updateLabels(); paint();
  });
  $('btn-play').addEventListener('click', function () {
    if (playing) { playing = false; $('btn-play').textContent = 'Play beide'; return; }
    if (!edges.L.a || !edges.P.a) {
      $('status').textContent = 'Zuerst für L und P je eine Kante ziehen';
      return;
    }
    playing = true;
    $('btn-play').textContent = 'Stop';
    prog.L = 0; prog.P = 0;
    var start = performance.now();
    var dur = 2200;
    function tick(now) {
      if (!playing) return;
      var u = Math.min(1, (now - start) / dur);
      var ease = 1 - Math.pow(1 - u, 1.35);
      // L first half, P second half with slight overlap
      prog.L = Math.max(0, Math.min(1, ease / 0.45));
      prog.P = Math.max(0, Math.min(1, (ease - 0.4) / 0.6));
      $('progL').value = String(Math.round(prog.L * 1000));
      $('progP').value = String(Math.round(prog.P * 1000));
      updateLabels(); paint();
      if (u < 1) requestAnimationFrame(tick);
      else { playing = false; $('btn-play').textContent = 'Play beide'; }
    }
    requestAnimationFrame(tick);
  });
  $('btn-copy').addEventListener('click', function () {
    navigator.clipboard.writeText($('export').value).then(function () {
      $('status').textContent = 'JSON kopiert';
    });
  });
  $('btn-download').addEventListener('click', function () {
    var blob = new Blob([$('export').value], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'lp-reveal-edges.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  // Draw edge: press-drag inside active letter
  var handleDrag = null; // 'a' | 'b' | null

  function nearHandle(p, edge) {
    if (!edge.a || !edge.b) return null;
    if (Math.hypot(p.x - edge.a.x, p.y - edge.a.y) < 22) return 'a';
    if (Math.hypot(p.x - edge.b.x, p.y - edge.b.y) < 22) return 'b';
    return null;
  }

  cv.addEventListener('pointerdown', function (e) {
    cv.setPointerCapture(e.pointerId);
    var p = canvasPos(e);
    var edge = edges[active];
    var h = nearHandle(p, edge);
    if (h) {
      handleDrag = h;
      return;
    }
    // Start new edge — prefer points inside letter, but allow near outline
    drawing = { letter: active, start: p, curr: p };
  });

  cv.addEventListener('pointermove', function (e) {
    var p = canvasPos(e);
    if (handleDrag) {
      edges[active][handleDrag] = p;
      // bump progress so edge is visible while editing
      if (prog[active] < 0.35) {
        prog[active] = 0.55;
        $(active === 'L' ? 'progL' : 'progP').value = '550';
      }
      updateLabels(); paint();
      return;
    }
    if (!drawing) return;
    drawing.curr = p;
    paint();
  });

  function endDraw(e) {
    if (handleDrag) { handleDrag = null; return; }
    if (!drawing) return;
    var p = e ? canvasPos(e) : drawing.curr;
    var a = drawing.start;
    var b = p || drawing.start;
    if (Math.hypot(b.x - a.x, b.y - a.y) < 12) {
      drawing = null;
      paint();
      return;
    }
    // Extend edge to a long line through the letter (keep drawn direction)
    edges[drawing.letter] = {
      a: { x: a.x, y: a.y },
      b: { x: b.x, y: b.y },
      flip: edges[drawing.letter].flip
    };
    // Auto-show mid reveal so the edge effect is immediately visible
    if (prog[drawing.letter] < 0.2) {
      prog[drawing.letter] = 0.55;
      $(drawing.letter === 'L' ? 'progL' : 'progP').value = '550';
    }
    drawing = null;
    updateLabels();
    paint();
  }

  cv.addEventListener('pointerup', endDraw);
  cv.addEventListener('pointercancel', function () {
    handleDrag = null;
    drawing = null;
    paint();
  });

  updateLabels();
  paint();
})();
  </script>
</body>
</html>
